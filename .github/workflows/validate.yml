name: Validate primitives
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check registry, domain boundaries and immutable sources
        run: python3 tools/primitives.py validate
      - name: Check complete Lean source and domain ownership inventory
        run: python3 tools/verify_lean.py --check-layout
      - name: Check validator regression scenarios
        run: python3 -m unittest discover -s tests -v
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain pinned in lean-toolchain
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-github-cache: "false"
          use-mathlib-cache: "false"
      - name: Clean build, audit every theorem and verify the video example
        run: python3 tools/verify_lean.py --output .lake/verification/ci-all.json
      - name: Upload the source-bound verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: lean-verification
          path: .lake/verification/ci-all.json
          include-hidden-files: true
          if-no-files-found: error
  evidence-graph-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
      - name: Fetch read-only consumer source at the fixture pins
        run: |
          python3 - <<'PY'
          from collections import defaultdict
          import json, os, re, subprocess
          from pathlib import Path
          import sys

          sys.path.insert(0, "tools")
          from check_core_assumption_freshness import PROBE_REVISION

          root = Path(os.environ["RUNNER_TEMP"]) / "fixture-repositories"
          pins = defaultdict(set)
          for descriptor in Path("docs/evidence-graph-fixtures").glob("*/fixture.json"):
              for material in json.loads(descriptor.read_text())["materials"]:
                  repo, revision = material["repo"], material["revision"]
                  if repo not in {"primitives", "svc-workflow", "dsh-agent-core"} or not re.fullmatch("[0-9a-f]{40}", revision):
                      raise SystemExit("unexpected fixture source")
                  pins[repo].add(revision)
          if not re.fullmatch("[0-9a-f]{40}", PROBE_REVISION):
              raise SystemExit("invalid Core probe revision")
          pins["dsh-agent-core"].add(PROBE_REVISION)
          for repo, revisions in pins.items():
              local = root / repo
              local.mkdir(parents=True)
              subprocess.run(["git", "init", "--bare", "-q", str(local)], check=True)
              for revision in sorted(revisions):
                  subprocess.run(["git", "-C", str(local), "fetch", "--no-tags", "--depth=1", "--quiet",
                                  f"https://github.com/mayf3/{repo}.git", revision], check=True, timeout=120)
          PY
      - name: Compile three real Workflow fixtures and detect deliberate evidence drift
        run: |
          python3 tools/evidence_graph_fixture_check.py \
            --repositories "$RUNNER_TEMP/fixture-repositories" \
            --output "$RUNNER_TEMP/evidence-graph-results"
      - name: Capture Core recovery and stale-attempt checks from the pinned implementation
        run: |
          python3 tools/capture_core_recovery_trace.py \
            --core-repo "$RUNNER_TEMP/fixture-repositories/dsh-agent-core" \
            --output "$RUNNER_TEMP/core-recovery-capture"
      - name: Validate the Core JSONL against the compiled Evidence Graph
        run: |
          python3 tools/trace_validate_core_check.py \
            --graph "$RUNNER_TEMP/evidence-graph-results/core/evidence-graph.json" \
            --capture "$RUNNER_TEMP/core-recovery-capture/core-recovery-capture.json" \
            --output "$RUNNER_TEMP/core-recovery-validation.json"
      - name: Observe Core assumptions, lose and recover the same Router route, and recompile coverage
        run: |
          python3 tools/check_core_assumption_freshness.py \
            --repositories "$RUNNER_TEMP/fixture-repositories" \
            --core-repo "$RUNNER_TEMP/fixture-repositories/dsh-agent-core" \
            --output "$RUNNER_TEMP/core-assumption-freshness"
      - name: Upload graphs, trace captures and validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-graph-fixtures
          path: |
            ${{ runner.temp }}/evidence-graph-results
            ${{ runner.temp }}/core-recovery-capture
            ${{ runner.temp }}/core-recovery-validation.json
            ${{ runner.temp }}/core-recovery-validation.segments
            ${{ runner.temp }}/core-assumption-freshness
          include-hidden-files: true
          if-no-files-found: error
