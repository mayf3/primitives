name: Validate primitives
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check registry, domain boundaries and immutable sources
        run: python3 tools/primitives.py validate
      - name: Check complete Lean source and domain ownership inventory
        run: python3 tools/verify_lean.py --check-layout
      - name: Check validator regression scenarios
        run: python3 -m unittest discover -s tests -v
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain pinned in lean-toolchain
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-github-cache: "false"
          use-mathlib-cache: "false"
      - name: Clean build, audit every theorem and verify the video example
        run: python3 tools/verify_lean.py --output .lake/verification/ci-all.json
      - name: Upload the source-bound verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: lean-verification
          path: .lake/verification/ci-all.json
          include-hidden-files: true
          if-no-files-found: error

  evidence-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Evidence Graph Compiler unit tests (positive + negative controls)
        run: python3 -m unittest tools.test_evidence_graph -v
      - name: Build primitives own evidence graph
        run: python3 tools/evidence_graph.py build --project .
      - name: Validate graph (policy gates)
        run: python3 tools/evidence_graph.py validate --project .
      - name: Determinism check (byte-identical rebuild)
        run: |
          python3 tools/evidence_graph.py build --project .
          sha256sum .evidence/evidence-graph.json > /tmp/h1
          python3 tools/evidence_graph.py build --project .
          sha256sum .evidence/evidence-graph.json > /tmp/h2
          diff /tmp/h1 /tmp/h2
      - name: Coverage summary (honest gaps must be visible, not fatal)
        run: python3 tools/evidence_graph.py coverage --project .
